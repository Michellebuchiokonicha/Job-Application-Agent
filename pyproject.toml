[project]
name = "jobagent"
version = "0.1.0"
description = "Personal job-application agent: inbox triage, application tracking, and (later) automated applying with a feedback loop."
readme = "README.md"
authors = [
    { name = "michellebuchiokonicha", email = "michelleokonicha@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "typer>=0.28.0",
]

[project.scripts]
jobagent = "jobagent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
