# Companies whose job boards `jobs fetch` reads: every open job, filtered to target roles
# in the UK. Each slug was checked against the ATS's public API (a wrong slug fails loudly).
#
# To add one: find the company's careers page. If it's on boards.greenhouse.io/<slug>,
# jobs.lever.co/<slug> or jobs.ashbyhq.com/<slug>, add a [[company]] block with that slug.
# For Lever companies hosted in the EU (jobs.eu.lever.co), add `eu = true`.

